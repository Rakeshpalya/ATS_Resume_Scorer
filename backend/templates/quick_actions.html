<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4;
    margin: 20mm;
  }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #1e293b;
    line-height: 1.5;
    margin: 0;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
    color: #0f172a;
    border-bottom: 2px solid #3b82f6;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .card {
    background: #f8fafc;
    border-left: 4px solid #3b82f6;
    padding: 12px 16px;
    margin-bottom: 14px;
    border-radius: 0 6px 6px 0;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: #1e3a8a;
    margin-bottom: 4px;
  }
  .card-body {
    font-size: 13px;
    color: #334155;
  }
</style>
</head>
<body>

<div class="title">Strategic Recommendations & Optimization Playbook</div>

{% for rec in analysis.recommendations %}
<div class="card">
  <div class="card-title">Priority Focus Area #{{ loop.index }}</div>
  <div class="card-body">{{ rec }}</div>
</div>
{% endfor %}

</body>
</html>
